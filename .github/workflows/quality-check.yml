name: Safe quality check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint (existing warnings allowed, errors fail)
        run: npm run lint
      - name: TypeScript check
        run: npm run typecheck
      - name: Build static assets
        run: npm run build
      - name: Offline unit tests (mocked integrations only)
        run: npx --yes tsx@4.20.6 --test tests/*.test.ts
      # Deliberately no Cloudflare credentials, secrets, deploy, or database commands.
